- name: Installer nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Créer le dossier du site
  ansible.builtin.file:
    path: /var/www/flowdesk
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Déployer la page d'accueil
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/flowdesk/index.html
    owner: www-data
    group: www-data
    mode: "0644"

- name: Déployer la config du site
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/flowdesk
    mode: "0644"
  notify: Recharger nginx

- name: Activer le site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/flowdesk
    dest: /etc/nginx/sites-enabled/flowdesk
    state: link
  notify: Recharger nginx

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Tester la config nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: nginx démarré et activé au boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Autoriser HTTP depuis le LB (IPv4)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_default_ipv4.address }}"
  loop: "{{ groups['lb'] }}"

- name: Autoriser HTTP depuis le LB (IPv6)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_default_ipv6.address }}"
  loop: "{{ groups['lb'] }}"
  when: hostvars[item].ansible_default_ipv6.address is defined