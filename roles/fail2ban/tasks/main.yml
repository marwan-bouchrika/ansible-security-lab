- name: Installer fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present

- name: Configurer fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Redémarrer fail2ban

- name: fail2ban démarré
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true